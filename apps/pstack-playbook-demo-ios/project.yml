name: PstackPlaybookDemo
options:
  bundleIdPrefix: com.pstack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  PstackPlaybookDemo:
    type: application
    platform: iOS
    sources:
      - path: PstackPlaybookDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pstack.PstackPlaybookDemo
        PRODUCT_NAME: PstackPlaybookDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Playbook Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_TESTABILITY: YES
    scheme:
      testTargets:
        - PstackPlaybookDemoTests

  PstackPlaybookDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PstackPlaybookDemoTests
    dependencies:
      - target: PstackPlaybookDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pstack.PstackPlaybookDemoTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PstackPlaybookDemo:
    build:
      targets:
        PstackPlaybookDemo: all
        PstackPlaybookDemoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PstackPlaybookDemoTests
