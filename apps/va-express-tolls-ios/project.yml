# XcodeGen spec. `xcodegen generate` writes VAExpressTolls.xcodeproj (git-ignored).
name: VAExpressTolls
options:
  bundleIdPrefix: dev.norm.tech-demos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TollsKit:
    path: TollsKit

targets:
  VAExpressTolls:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: TollsKit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set in Xcode (Signing & Capabilities) or via `DEVELOPMENT_TEAM=XXXX xcodegen generate` for a device.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    info:
      path: App/Info.plist   # generated by xcodegen, git-ignored
      properties:
        CFBundleDisplayName: VA Tolls
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # http to localhost / LAN IPs for the dev API; anything else must be https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
