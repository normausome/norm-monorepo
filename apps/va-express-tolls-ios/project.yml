name: VAExpressTolls
options:
  bundleIdPrefix: com.normanau
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  VAExpressTolls:
    type: application
    platform: iOS
    sources:
      - VAExpressTolls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanau.vaExpressTolls
        PRODUCT_NAME: VAExpressTolls
        INFOPLIST_FILE: VAExpressTolls/Info.plist
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
    scheme:
      testTargets:
        - VAExpressTollsTests
  VAExpressTollsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VAExpressTollsTests
    dependencies:
      - target: VAExpressTolls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanau.vaExpressTolls.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VAExpressTolls.app/VAExpressTolls"
