<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pick a Northern Virginia Express Lanes corridor (495, I-66 Inside or Outside the Beltway), read the tolling rules, and open the official toll calculator."
    />
    <title>VA Express Lanes toll lookup</title>
    <script>
      // Runs before paint so a stored/system dark preference never flashes light.
      try {
        var t = localStorage.getItem("theme")
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark")
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
