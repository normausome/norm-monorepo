name: Demo

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    name: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Skip the commit that only stores the recording
        id: gate
        run: |
          msg=$(git log -1 --pretty=%s)
          if [ "$msg" = "chore(demo): add preview stills and video" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.skip != 'true'

      - name: Install the recorder
        if: steps.gate.outputs.skip != 'true'
        working-directory: .github/demo
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Record each changed Vite app
        if: steps.gate.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mapfile -t slugs < <(git diff --name-only "$BASE_SHA" HEAD | awk -F/ '/^apps\/[^/]+\// { print $2 }' | sort -u)
          recorded=0
          for slug in "${slugs[@]+"${slugs[@]}"}"; do
            [ -n "$slug" ] || continue
            [ -f "apps/$slug/package.json" ] || continue
            [ -f "apps/$slug/vite.config.ts" ] || continue
            echo "recording $slug"
            port=4173
            (
              cd "apps/$slug"
              bun install --frozen-lockfile
              bun run build
              bun run preview -- --host 127.0.0.1 --port "$port" --strictPort
            ) &
            preview_pid=$!
            ready=0
            for _ in $(seq 1 90); do
              if curl -sf "http://127.0.0.1:$port" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then
              kill "$preview_pid" || true
              echo "$slug did not serve a preview" >&2
              exit 1
            fi
            node .github/demo/capture.mjs "http://127.0.0.1:$port" ".demo-capture/$slug"
            kill "$preview_pid" || true
            wait "$preview_pid" || true
            recorded=$((recorded + 1))
          done
          echo "recorded=$recorded" >> "$GITHUB_ENV"
          if [ "$recorded" = 0 ]; then
            echo "No changed Vite app. Nothing to record."
          fi

      - name: Commit the recording onto the pull request
        if: steps.gate.outputs.skip != 'true' && env.recorded != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .demo-capture
          if git diff --cached --quiet; then
            echo "Capture matched the files already on the branch."
            exit 0
          fi
          git commit -m "chore(demo): add preview stills and video"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Comment with the stills and the video
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          found=0
          for dir in .demo-capture/*; do
            [ -d "$dir" ] || continue
            found=1
          done
          if [ "$found" != 1 ]; then
            echo "No recording on this branch."
            exit 0
          fi
          SHA=$(git rev-parse HEAD)
          body="<!-- demo-capture -->"$'\n'"## Demo"$'\n'
          body+="The first still is the page as it loads. The second is after the first button clicks. The third is the phone width. Open the video link to play the pass."$'\n'
          for dir in .demo-capture/*; do
            [ -d "$dir" ] || continue
            slug=$(basename "$dir")
            raw="https://github.com/${{ github.repository }}/raw/${SHA}/.demo-capture/${slug}"
            body+=$'\n'"### ${slug}"$'\n'
            body+="![desktop](${raw}/desktop.png)"$'\n'
            body+="![after clicks](${raw}/after.png)"$'\n'
            body+="![mobile](${raw}/mobile.png)"$'\n'
            body+="[Play the video](${raw}/demo.webm)"$'\n'
          done
          gh pr comment "$PR" --body "$body"
